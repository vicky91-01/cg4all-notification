<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CG4ALL Notification System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <!-- Logo -->
        <div class="logo">
            CG4ALL
        </div>


        <!-- Navigation Links -->
        <div class="nav-links">

            <a href="#">Home</a>

            <a href="#">Desktop</a>

            <a href="#">Services</a>

            <a href="#">Library</a>

            <a href="#">Join Us</a>

            <a href="#">Contact Us</a>


            <!-- ================= NOTIFICATION ================= -->

            <div class="notification">

                <!-- Notification Button -->
                <button id="notificationBtn" aria-label="Notifications">

                    🔔

                    <!-- Unread Count -->
                    <span id="notificationCount">0</span>

                </button>


                <!-- Notification Panel -->
                <div id="notificationPanel" class="notification-panel">

                    <div class="notification-header">

                        <h3>Notifications</h3>

                    </div>


                    <!-- Notifications will be inserted here using JavaScript -->
                    <div id="notificationList"></div>


                    <!-- Empty notification message -->
                    <div id="noNotifications" class="no-notifications">

                        No notifications

                    </div>

                </div>

            </div>


            <!-- Quick Guide -->
            <button class="quick-guide">

                Quick Guide

            </button>

        </div>

    </nav>


    <!-- ================= MAIN CONTENT ================= -->

    <main class="main-content">

        <h1>Welcome to CG4ALL</h1>

        <p>
            This is the existing website content.
        </p>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
